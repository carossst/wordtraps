name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Node 22 currently ships npm 10.9.x, which can crash in Arborist on this
      # dependency tree with "Cannot read properties of null (reading edgesOut)".
      # Pin a known-good npm 11 release, then resolve fresh for the Linux runner.
      - run: npm install -g npm@11.6.0
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
      - run: npm run format:check
